[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "group-memory-qml"
version = "0.1.0"
description = "Correctness-tested symmetry reuse for a small quantum sensor classifier"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "GroupMemory contributors"}]
dependencies = [
  "numpy>=2.0,<3",
  "qiskit==2.6.0",
  "qiskit-aer==0.17.2",
  "qiskit-algorithms==0.4.0",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
group-memory-demo = "group_memory_qml.demo:main"

[project.urls]
Repository = "https://github.com/BoredDuffa/group-memory-qml"
Issues = "https://github.com/BoredDuffa/group-memory-qml/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

